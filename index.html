    <script>
      // Applies the stored theme (default: light) before React mounts,
      // so the first paint never flashes the wrong theme.
      (function () {
        var stored = localStorage.getItem("theme-mode");
        document.documentElement.dataset.theme = stored === "dark" ? "dark" : "light";
      })();
    </script>
